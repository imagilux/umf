[package]
name = "umf-builder"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
homepage.workspace = true
repository.workspace = true
description = "UMF recipe AST → OCI artifacts (container + bootable-OS images)."

[dependencies]
umf-core = { workspace = true }
umf-oci = { workspace = true }
umf-engine = { workspace = true }
umf-vmm = { workspace = true }
# `ADD <url>` egress is governed by the same default-deny SSRF policy the
# RUN sandbox uses (umf_networking::ssrf). A direct edge rather than reaching
# through umf-engine: the dependency is real and the tree stays acyclic
# (umf-networking has no internal umf deps).
umf-networking = { workspace = true }
bytes = { workspace = true }
flate2 = { workspace = true }
reqwest = { workspace = true }
hex = { workspace = true }
oci-client = { workspace = true }
oci-spec = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
tar = { workspace = true }
tempfile = { workspace = true }
thiserror = { workspace = true }
# `net` for `lookup_host`: `ADD <url>` resolves the destination itself so the
# egress policy can vet the address before the connect.
tokio = { workspace = true, features = ["net"] }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
walkdir = { workspace = true }

[dev-dependencies]
# `fatfs` is only used by the disk tests, to read back the projected ESP.
fatfs = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }
umf-parser = { workspace = true }
# Round-trip tests boot an in-process OCI distribution v2 server
# instead of `registry:2` via podman — see umf_oci::test_registry.
umf-oci = { workspace = true, features = ["test-server"] }
# The `ADD <url>` tests build compressed-tar / zip payloads in memory to
# exercise each codec the staging unpacker extracts.
bzip2 = { workspace = true }
liblzma = { workspace = true }
zip = { workspace = true }
zstd = { workspace = true }

[lints]
workspace = true
