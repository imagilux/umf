---
fixes:
  - |
    Layer blobs may now be xz- or bzip2-compressed, not just gzip, zstd, or
    uncompressed. Codec selection was implemented twice — once for layer
    blobs and once for fetched ``ADD <url>`` payloads — and the two had
    drifted: a tarball the staging unpacker read happily was rejected on the
    layer path for no reason a caller could have predicted. Both now share a
    single decoder (``umf_oci::compression``), so a plain tar and a gzip-,
    zstd-, xz-, or bzip2-compressed one are accepted identically wherever a
    tar stream is read, and the decompression ceiling that guards against
    archive bombs applies uniformly across every codec including the
    uncompressed case.
    A payload that cannot be a tar stream at all — a zip, whose index lives
    at the end of the file, or a squashfs filesystem image — now fails with a
    message naming the format instead of handing malformed bytes to the tar
    reader.
    xz- and bzip2-compressed layers are now **accepted and normalised**
    rather than refused. Neither is a media type the OCI image-spec defines
    for layers, but images built by other tooling carry them, so refusing
    made a usable image unusable. UMF now reads them and re-encodes such a
    layer into the build's own codec on the way in, so everything ``umf
    build`` emits still carries only ``…v1.tar``, ``…v1.tar+gzip`` or
    ``…v1.tar+zstd``. Because ``diff_id`` is the digest of the
    *uncompressed* tar, re-compression leaves the layer's identity — and the
    image's content identity — unchanged; only the blob digest and the
    descriptor's media type move, and a layer already using a spec-defined
    codec passes through untouched. A codec UMF has no decoder for is still
    refused outright.
