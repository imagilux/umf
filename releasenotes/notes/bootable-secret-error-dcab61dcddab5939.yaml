---
fixes:
  - |
    The ``--secret`` rejection on a bootable build said the flag was *"only
    meaningful for container builds"*. The specification says the opposite: the
    secret is mounted "as a tmpfs file inside the ``RUN`` step's container **or
    VM**", and its worked example is ``sbsign --key /run/secrets/key`` — Secure
    Boot signing, which only makes sense in a bootable build. The micro-VM
    ``RUN`` backend simply has no secret mount yet, so the error now says the
    path is unimplemented and points at ``known-limitations.md``, instead of
    telling authors their intent was wrong.
other:
  - |
    ``docs/known-limitations.md`` records the ``--secret`` gap for bootable
    builds, with the container-build-then-``ADD`` workaround for signing
    workflows.
